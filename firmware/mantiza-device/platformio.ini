; Mantiza device firmware: StickS3 as a Bluetooth LE mouse (absolute pointer) + keyboard for iPhone.
; ABSOLUTE_POINTER=0 in build_flags builds the old relative mouse (fallback).
; Base settings come from M5Stack's StickS3 docs (Docs/StickS3.pdf, page 14).

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DABSOLUTE_POINTER=1
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    M5PM1=https://github.com/m5stack/M5PM1
    h2zero/NimBLE-Arduino@^1.4.3
